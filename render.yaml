services:
  - type: web
    name: vivek-portfolio
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: waitress-serve --listen=0.0.0.0:$PORT app:app
    healthCheckPath: /health
    disk:
      name: portfolio-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: SESSION_SECRET
        generateValue: true
      - key: DATA_KEY_B64
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: COOKIE_SECURE
        value: "1"
      - key: DATABASE_PATH
        value: /var/data/portfolio.db
